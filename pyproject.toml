[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rrop"
version = "0.1.0"
description = "Rings of Power static recompilation for Linux and Windows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.urls]
Repository = "https://github.com/kruzeman/RROP"
Issues = "https://github.com/kruzeman/RROP/issues"

[project.scripts]
rrop-recompile = "genesis_recompiler.cli:main"

[tool.setuptools.packages.find]
include = ["genesis_recompiler*"]

[tool.setuptools.package-data]
genesis_recompiler = ["*.h", "*.cpp", "ymfm/*"]
